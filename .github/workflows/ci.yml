name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified tag
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, verified tag
        with:
          go-version-file: go.mod
          cache: false
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 -timeout=30s ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=30s ./...
      - run: go build -trimpath ./cmd/momiao
