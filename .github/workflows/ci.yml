name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified tag
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, verified tag
        with:
          go-version-file: go.mod
          cache: false
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 -timeout=30s ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=30s ./...
      - run: go build -trimpath ./cmd/momiao

  wallet-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_DB: momiao_test_ci
          POSTGRES_USER: postgres
          # Ephemeral runner fixture only; never a deployment credential.
          POSTGRES_PASSWORD: momiao-ci-fixture
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d momiao_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      MOMIAO_TEST_DATABASE_URL: postgres://postgres:momiao-ci-fixture@127.0.0.1:55432/momiao_test_ci?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race -count=1 -timeout=90s -v ./internal/platform

      - name: Prepare disposable Poker database fixture
        shell: bash
        env:
          POKER_TEST_CONNECTION_FILE: ${{ runner.temp }}/poker-test-connection.json
        run: |
          psql --version
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse
          connection = urllib.parse.urlsplit(os.environ['MOMIAO_TEST_DATABASE_URL'])
          assert connection.hostname == '127.0.0.1' and connection.port == 55432
          path = pathlib.Path(os.environ['POKER_TEST_CONNECTION_FILE'])
          path.write_text(json.dumps({
              'Host': connection.hostname, 'Port': connection.port,
              'User': urllib.parse.unquote(connection.username),
              'Password': urllib.parse.unquote(connection.password),
              'Database': 'postgres', 'SSLMode': 'disable',
          }))
          path.chmod(0o600)
          PY
      - name: Verify Poker close guard and password profiles on real PostgreSQL
        env:
          POKER_TEST_CONNECTION_FILE: ${{ runner.temp }}/poker-test-connection.json
        run: go test -race -count=1 -timeout=90s -v -run '^(TestHostCloseFinalGuard|TestPasswordProfilesEmptyAndProfiles|TestPasswordProfilesMalformed|TestPasswordProfilesFailures)$' ./internal/poker

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified tag
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
